<header class="header">

    <div class="header__logo">

        <img
            src="/heartzclub/src/main/resources/components/img/heart.png"
            class="logo__icon"
        >

        <img
            src="/heartzclub/src/main/resources/components/img/heart.png"
            class="logo__icon"
        >

        <img
            src="/heartzclub/src/main/resources/components/img/heart.png"
            class="logo__icon"
        >

        <a href="/heartzclub/src/main/resources/home/home.html">

            <h1 class="logo__title">
                Heartz Club
            </h1>

        </a>

    </div>

    <div class="header__search">

        <input
            type="text"
            id="header-search-input"
            class="search__input"
            placeholder="Pesquisar jogos..."
            autocomplete="off"
        >

        <button
            class="search__button"
            id="search-button"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"
                />

            </svg>

        </button>

        <div
            class="search-results"
            id="search-results"
        ></div>

    </div>

    <nav
        class="header__nav"
        id="nav"
    ></nav>

</header>

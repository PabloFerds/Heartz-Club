<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Heartz Club</title>

    <link
        rel="stylesheet"
        href="../components/styles/global.css"
    >

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <div id="header"></div>

    <main class="admin">

        <section class="admin-panel">

            <h1 class="admin-title">
                Painel Administrativo
            </h1>

            <p class="admin-subtitle">
                Adicione novos jogos ao catálogo
            </p>

            <form
                class="admin-form"
                onsubmit="adicionarJogo(event)"
            >

                <div class="form-group">

                    <label>
                        Nome do jogo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Gênero
                    </label>

                    <input
                        type="text"
                        id="genero"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        URL da imagem
                    </label>

                    <input
                        type="text"
                        id="imagemUrl"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Nota
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        min="0"
                        max="10"
                        id="nota"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        required
                    ></textarea>

                </div>

                <button
                    type="submit"
                    class="admin-button"
                >
                    Adicionar jogo
                </button>

            </form>

        </section>

    </main>

    <div id="footer"></div>

    <script src="../components/inlcuide.js"></script>

    <script src="admin.js"></script>

</body>

</html>
